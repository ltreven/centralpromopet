imagePullSecrets:
  - name: ghcr-pull-secret
api:
  appOrigins: "https://centralpromopet-stg.sabialabs.de"
  image:
    repository: ghcr.io/ltreven/centralpromopet-api
    tag: 35f164ba9a4f7e2b84c9a023e76824599274b630
    pullPolicy: Always
  existingSecret: centralpromopet-api-secret
web:
  image:
    repository: ghcr.io/ltreven/centralpromopet-web
    tag: 35f164ba9a4f7e2b84c9a023e76824599274b630
    pullPolicy: Always
postgres:
  auth:
    existingSecret: centralpromopet-db-credentials
  persistence:
    enabled: true
    size: 10Gi
    storageClass: local-path
migrations:
  enabled: true
ingress:
  className: traefik
  host: centralpromopet-stg.sabialabs.de
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: centralpromopet-staging-tls
