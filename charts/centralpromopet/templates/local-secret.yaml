{{- if and (not .Values.api.existingSecret) (not .Values.postgres.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: centralpromopet-local
type: Opaque
stringData:
  database-url: {{ printf "postgres://%s:%s@centralpromopet-postgresql:%v/%s" .Values.postgres.auth.username .Values.postgres.auth.password .Values.postgres.port .Values.postgres.auth.database | quote }}
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  jwt-secret: "local-development-secret-change-me-123456789"
{{- end }}
