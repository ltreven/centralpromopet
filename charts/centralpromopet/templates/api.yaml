apiVersion: apps/v1
kind: Deployment
metadata:
  name: centralpromopet-api
  labels:
    app.kubernetes.io/name: centralpromopet-api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: centralpromopet-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centralpromopet-api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.api.googleClientId | quote }}
            - name: GOOGLE_ONE_TAP_ENABLED
              value: {{ .Values.api.googleOneTapEnabled | quote }}
            - name: ADMIN_EMAILS
              value: {{ .Values.api.adminEmails | quote }}
            - name: APP_ORIGINS
              value: {{ .Values.api.appOrigins | quote }}
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default "centralpromopet-local" .Values.api.existingSecret }}
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default "centralpromopet-local" .Values.api.existingSecret }}
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: centralpromopet-api
spec:
  selector:
    app.kubernetes.io/name: centralpromopet-api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
